name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. v0.1.0). Must match package.json's version."
        required: true
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The installed browsers look for updates under this tag, so it must
      # name the version they are built with.
      - name: Check the version
        env:
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match package.json ($VERSION)"; exit 1
          fi
      - name: Install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux --publish never

      - name: Checksums
        working-directory: release
        run: sha256sum *.AppImage *.deb *.rpm > ../checksums-linux.txt

      # latest-linux.yml tells installed copies about this release (the
      # AppImage carries its block map inside).
      - uses: actions/upload-artifact@v7
        with:
          name: moon-browser-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/latest-linux.yml
            checksums-linux.txt
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Netflix and other streaming services only accept Widevine in a
      # browser signed for Verified Media Path: build/vmp-sign.cjs signs it
      # with castLabs EVS when the repository has an EVS account (secrets
      # EVS_ACCOUNT_NAME and EVS_PASSWD).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --upgrade castlabs-evs
      - name: Package
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        shell: bash
        run: |
          npx electron-builder --win --publish never
          if [ -z "$EVS_ACCOUNT_NAME" ]; then
            echo "::warning::Not signed for Verified Media Path (no EVS secrets): Netflix won't play on Windows."
          fi

      - name: Checksums
        shell: bash
        working-directory: release
        run: sha256sum *.exe > ../checksums-windows.txt

      # latest.yml and the block map let installed copies update themselves,
      # downloading only the parts that changed.
      - uses: actions/upload-artifact@v7
        with:
          name: moon-browser-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            checksums-windows.txt
          if-no-files-found: error

  # Apple Silicon and Intel, each a .dmg to install and a .zip that installed
  # copies update from (both named in latest-mac.yml).
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Verified Media Path, as on Windows: build/fuses.cjs signs with the
      # same EVS account, before the app is code-signed.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --upgrade castlabs-evs
      # Without an Apple Developer ID (secrets CSC_LINK and CSC_KEY_PASSWORD;
      # notarized with APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and
      # APPLE_TEAM_ID) the app is signed ad hoc: it runs, but macOS asks
      # once before the first start, and updates are downloaded by hand.
      - name: Package
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            npx electron-builder --mac --publish never -c.mac.identity="Developer ID Application"
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            npx electron-builder --mac --publish never
            echo "::warning::macOS build signed ad hoc (no Apple Developer ID): not notarized, updates are downloaded by hand."
          fi
          if [ -z "$EVS_ACCOUNT_NAME" ]; then
            echo "::warning::Not signed for Verified Media Path (no EVS secrets): Netflix plays in lower resolution on macOS."
          fi

      # The signature must hold, and the Apple Silicon app must start.
      - name: Check the apps
        run: |
          for app in release/mac*/"Moon Browser.app"; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done
          app="release/mac-arm64/Moon Browser.app"
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Contents/Info.plist")"
          "$exe" > app.log 2>&1 &
          sleep 20
          if ! pgrep -f "$exe" > /dev/null; then
            echo "Moon Browser exited during start-up:"; cat app.log
            exit 1
          fi
          pkill -f "$exe" || true

      - name: Checksums
        working-directory: release
        run: shasum -a 256 *.dmg *.zip > ../checksums-mac.txt

      - uses: actions/upload-artifact@v7
        with:
          name: moon-browser-mac
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml
            checksums-mac.txt
          if-no-files-found: error

  publish:
    needs: [build-linux, build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: moon-browser-linux
          path: dist/linux
      - uses: actions/download-artifact@v8
        with:
          name: moon-browser-windows
          path: dist/windows
      - uses: actions/download-artifact@v8
        with:
          name: moon-browser-mac
          path: dist/mac

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Moon Browser ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/linux/**/*.AppImage
            dist/linux/**/*.deb
            dist/linux/**/*.rpm
            dist/linux/**/latest-linux.yml
            dist/linux/checksums-linux.txt
            dist/windows/**/*.exe
            dist/windows/**/*.exe.blockmap
            dist/windows/**/latest.yml
            dist/windows/checksums-windows.txt
            dist/mac/**/*.dmg
            dist/mac/**/*.dmg.blockmap
            dist/mac/**/*.zip
            dist/mac/**/*.zip.blockmap
            dist/mac/**/latest-mac.yml
            dist/mac/checksums-mac.txt
