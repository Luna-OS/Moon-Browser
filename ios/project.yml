# Luma for iPhone and iPad. The Xcode project is generated from this file:
#   brew install xcodegen && cd ios && xcodegen generate && open Luma.xcodeproj
name: Luma
options:
  bundleIdPrefix: io.lunaos
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your own team in Xcode (Signing & Capabilities) or here.
    DEVELOPMENT_TEAM: ""

targets:
  Luma:
    type: application
    platform: iOS
    sources:
      - path: Luma
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lunaos.moonbrowser.ios
        PRODUCT_NAME: Luma
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: Luma/Info.plist
      properties:
        CFBundleDisplayName: Luma
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Links from other apps. Becoming the default browser additionally
        # needs Apple's com.apple.developer.web-browser entitlement (README).
        CFBundleURLTypes:
          - CFBundleURLName: io.lunaos.moonbrowser.ios
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [luma, http, https]
        # Downloads show up in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # What iOS shows before a site may use them.
        NSCameraUsageDescription: A website you are visiting wants to use the camera.
        NSMicrophoneUsageDescription: A website you are visiting wants to use the microphone.
        NSLocationWhenInUseUsageDescription: A website you are visiting wants to know your location.
        NSPhotoLibraryAddUsageDescription: Luma saves pictures you choose to your photo library.
        # Pages on the local network and plain-HTTP sites must stay reachable in a browser.
        NSLocalNetworkUsageDescription: Luma opens pages of devices on your local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true

  LumaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LumaTests
    dependencies:
      - target: Luma
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lunaos.moonbrowser.ios.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Luma:
    build:
      targets:
        Luma: all
        LumaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LumaTests
    archive:
      config: Release
