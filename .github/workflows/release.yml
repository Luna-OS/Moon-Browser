name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. v0.1.0). Must match package.json's version."
        required: true
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The installed browsers look for updates under this tag, so it must
      # name the version they are built with.
      - name: Check the version
        env:
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match package.json ($VERSION)"; exit 1
          fi
      - name: Install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux --publish never

      - name: Checksums
        working-directory: release
        run: sha256sum *.AppImage *.deb *.rpm > ../checksums-linux.txt

      # latest-linux.yml tells installed copies about this release (the
      # AppImage carries its block map inside).
      - uses: actions/upload-artifact@v4
        with:
          name: moon-browser-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/latest-linux.yml
            checksums-linux.txt
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Netflix and other streaming services only accept Widevine in a
      # browser signed for Verified Media Path: build/vmp-sign.cjs signs it
      # with castLabs EVS when the repository has an EVS account (secrets
      # EVS_ACCOUNT_NAME and EVS_PASSWD).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --upgrade castlabs-evs
      - name: Package
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        shell: bash
        run: |
          npx electron-builder --win --publish never
          if [ -z "$EVS_ACCOUNT_NAME" ]; then
            echo "::warning::Not signed for Verified Media Path (no EVS secrets): Netflix won't play on Windows."
          fi

      - name: Checksums
        shell: bash
        working-directory: release
        run: sha256sum *.exe > ../checksums-windows.txt

      # latest.yml and the block map let installed copies update themselves,
      # downloading only the parts that changed.
      - uses: actions/upload-artifact@v4
        with:
          name: moon-browser-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            checksums-windows.txt
          if-no-files-found: error

  # macOS comes later.

  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: moon-browser-linux
          path: dist/linux
      - uses: actions/download-artifact@v5
        with:
          name: moon-browser-windows
          path: dist/windows

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Moon Browser ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/linux/**/*.AppImage
            dist/linux/**/*.deb
            dist/linux/**/*.rpm
            dist/linux/**/latest-linux.yml
            dist/linux/checksums-linux.txt
            dist/windows/**/*.exe
            dist/windows/**/*.exe.blockmap
            dist/windows/**/latest.yml
            dist/windows/checksums-windows.txt
