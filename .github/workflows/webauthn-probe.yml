# Temporary: see scripts/webauthn-probe.mjs.
name: WebAuthn probe
on:
  push:
    branches: [claude/pensive-carson-g6svsf]
    paths: [scripts/webauthn-probe.mjs, .github/workflows/webauthn-probe.yml]
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/webauthn-probe.mjs
        timeout-minutes: 3
