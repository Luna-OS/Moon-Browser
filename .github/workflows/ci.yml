name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The Security updates workflow tests an update with all of this first.
  workflow_call:
    inputs:
      ref:
        description: "The commit to test"
        type: string
        required: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # Starts the real browser and drives it: tabs, the address bar, search,
  # settings, the Comet import, split view and the security boundaries
  # between web pages and Luma's own pages.
  e2e:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # New on macOS: reported, but doesn't fail CI until it has proven steady.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: End-to-end test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1400x900x24" node scripts/e2e.mjs
      - name: End-to-end test (Windows)
        if: runner.os == 'Windows'
        run: node scripts/e2e.mjs
      - name: End-to-end test (macOS)
        if: runner.os == 'macOS'
        run: node scripts/e2e.mjs

  package:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: --linux deb AppImage rpm --x64
          - os: windows-latest
            targets: --win nsis --x64
          # Both Mac builds, as released: signed ad hoc, as without a Developer ID.
          - os: macos-latest
            targets: --mac dmg zip --arm64 --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm run build
      # The unit tests on a Mac too.
      - if: runner.os == 'macOS'
        run: npm test
      # Windows and macOS: signed for Verified Media Path like a release
      # (build/vmp-sign.cjs), where the EVS secrets are available — not for
      # pull requests from forks or Dependabot.
      - uses: actions/setup-python@v7
        if: runner.os != 'Linux'
        with:
          python-version: "3.12"
      - if: runner.os != 'Linux'
        run: pip install --upgrade castlabs-evs
      - run: npx electron-builder ${{ matrix.targets }} --publish never
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          # electron-builder skips macOS code signing in pull requests unless
          # told otherwise; ad hoc signing uses no secrets.
          CSC_FOR_PULL_REQUEST: ${{ runner.os == 'macOS' }}

      # Start the packaged app (with its fuses flipped) and make sure it is
      # still running after 20 s.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a release/linux-unpacked/moon-browser --no-sandbox > app.log 2>&1 &
          sleep 20
          if ! pgrep -f "release/linux-unpacked/moon-browser" > /dev/null; then
            echo "Luma exited during start-up:"; cat app.log
            exit 1
          fi
          pkill -f "release/linux-unpacked/moon-browser" || true

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "release\win-unpacked\moon-browser.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) {
            Write-Host "Luma exited during start-up with code $($app.ExitCode)"
            exit 1
          }
          Stop-Process -Id $app.Id -Force

      # Both apps: a valid signature (Apple Silicon runs nothing else), the
      # right architecture, the reasons macOS needs before a site may use the
      # camera or microphone, links from other apps, and both updates named
      # in latest-mac.yml. Then the Apple Silicon app must start and keep
      # running.
      - name: Check and start the Mac apps
        if: runner.os == 'macOS'
        run: |
          for dir in mac-arm64:arm64 mac:x86_64; do
            app="release/${dir%%:*}/Luma.app"
            plist="$app/Contents/Info.plist"
            exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$plist")"
            codesign --verify --deep --strict --verbose=2 "$app"
            [ "$(lipo -archs "$exe")" = "${dir##*:}" ] || { echo "$exe is $(lipo -archs "$exe")"; exit 1; }
            for key in NSCameraUsageDescription NSMicrophoneUsageDescription CFBundleURLTypes:0:CFBundleURLSchemes:1; do
              /usr/libexec/PlistBuddy -c "Print :$key" "$plist" > /dev/null || { echo "$key missing"; exit 1; }
            done
          done
          grep -q "mac-arm64.zip" release/latest-mac.yml && grep -q "mac-x64.zip" release/latest-mac.yml
          # What the built-in updater checks before it swaps in a new version
          # (src/main/mac-update.ts): the zip unpacks to a correctly signed
          # Luma of the version latest-mac.yml names.
          version="$(node -p "require('./package.json').version")"
          ditto -x -k release/*-mac-arm64.zip update-check
          codesign --verify --deep --strict "update-check/Luma.app"
          [ "$(plutil -extract CFBundleIdentifier raw -o - "update-check/Luma.app/Contents/Info.plist")" = io.lunaos.moonbrowser ]
          [ "$(plutil -extract CFBundleShortVersionString raw -o - "update-check/Luma.app/Contents/Info.plist")" = "$version" ]
          grep -q "^version: $version" release/latest-mac.yml

          app="release/mac-arm64/Luma.app"
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Contents/Info.plist")"
          "$exe" > app.log 2>&1 &
          sleep 20
          if ! pgrep -f "$exe" > /dev/null; then
            echo "Luma exited during start-up:"; cat app.log
            exit 1
          fi
          pkill -f "$exe" || true

      # The installer on real Windows: install, update over it the way the
      # built-in updater does (--updated), then uninstall. The browser
      # registration must survive the update and go with the uninstall.
      - name: Install, update and uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem release\*.exe | Select-Object -First 1).FullName
          $dir = "$env:LOCALAPPDATA\Programs\moon-browser"
          $reg = "HKCU:\Software\RegisteredApplications"
          function Registered { (Get-ItemProperty $reg -ErrorAction SilentlyContinue)."Moon Browser" }

          Start-Process -Wait -FilePath $setup -ArgumentList "/S"
          if (-not (Test-Path "$dir\moon-browser.exe")) { throw "not installed" }
          # koffi's native module, for Windows Hello in extensions (src/main/webauthn-win.ts).
          if (-not (Test-Path "$dir\resources\koffi\win32_x64\koffi.node")) { throw "koffi.node missing" }
          if (-not (Registered)) { throw "not registered as a browser" }
          $command = (Get-ItemProperty "HKCU:\Software\Classes\MoonBrowserURL\shell\open\command")."(default)"
          if ($command -notlike '*" -- "%1"') { throw "unsafe link command: $command" }

          Start-Process -Wait -FilePath $setup -ArgumentList "--updated", "/S"
          if (-not (Test-Path "$dir\moon-browser.exe")) { throw "gone after the update" }
          if (-not (Registered)) { throw "registration lost in the update" }

          $uninstaller = (Get-ChildItem "$dir\Uninstall*.exe" | Select-Object -First 1).FullName
          Start-Process -Wait -FilePath $uninstaller -ArgumentList "/S", "_?=$dir"
          # Windows may still hold the file a moment (a virus scan): give it time.
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\moon-browser.exe"); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path "$dir\moon-browser.exe") { throw "still installed" }
          if (Registered) { throw "still registered after uninstalling" }
          Write-Host "Installed, updated and uninstalled cleanly."

      - uses: actions/upload-artifact@v7
        with:
          name: luma-${{ runner.os }}
          path: |
            release/*.exe
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/*.dmg
          if-no-files-found: error
          retention-days: 7
