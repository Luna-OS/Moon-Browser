<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2060"/>
      <stop offset="1" stop-color="#0b0920"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.25" r="0.75">
      <stop offset="0" stop-color="#b9aefb" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#b9aefb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fdfbff"/>
      <stop offset="0.55" stop-color="#ddd6ff"/>
      <stop offset="1" stop-color="#a89cf2"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ad7f5"/>
      <stop offset="0.5" stop-color="#d6cffd"/>
      <stop offset="1" stop-color="#7fe3c6"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="322" cy="198" r="118" fill="#000"/>
    </mask>
    <!-- The front half of the orbit passes in front of the moon. -->
    <clipPath id="front">
      <rect x="0" y="262" width="512" height="250"/>
    </clipPath>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>
  <rect x="17" y="17" width="478" height="478" rx="111" fill="none" stroke="#b9aefb" stroke-opacity="0.3" stroke-width="2"/>
  <circle cx="396" cy="108" r="5" fill="#fff" opacity="0.9"/>
  <circle cx="432" cy="176" r="3.5" fill="#d6cffd" opacity="0.8"/>
  <circle cx="104" cy="118" r="3.5" fill="#9ad7f5" opacity="0.7"/>
  <circle cx="126" cy="410" r="3" fill="#fff" opacity="0.6"/>
  <ellipse cx="256" cy="262" rx="196" ry="62" transform="rotate(-18 256 262)" fill="none" stroke="url(#orbit)" stroke-width="16" stroke-opacity="0.45"/>
  <circle cx="252" cy="258" r="146" fill="#b9aefb" opacity="0.35" filter="url(#blur)" mask="url(#crescent)"/>
  <circle cx="252" cy="258" r="146" fill="url(#moon)" mask="url(#crescent)"/>
  <g clip-path="url(#front)">
    <ellipse cx="256" cy="262" rx="196" ry="62" transform="rotate(-18 256 262)" fill="none" stroke="url(#orbit)" stroke-width="16" stroke-linecap="round"/>
  </g>
  <circle cx="419" cy="203" r="13" fill="#7fe3c6"/>
</svg>
